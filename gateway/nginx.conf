# Gateway same-origin: o navegador fala com UMA origem só.
# Isso elimina CORS e faz os cookies (SameSite=Lax) funcionarem,
# inclusive em rede local via IP (http://<host>:8010).
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Compressão: o bundle JS (~1.4MB) cai para ~1/3 no fio.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        text/css
        image/svg+xml
        font/woff2;

    # Assets com hash no nome são imutáveis: cache longo no navegador.
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # API → backend (mantém o prefixo /api/)
    location /api/ {
        proxy_pass http://backend:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Docs/OpenAPI (útil em homologação; bloqueie em produção se quiser)
    location = /docs {
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
    }

    # App (SSR TanStack Start, com streaming)
    location / {
        proxy_pass http://frontend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
